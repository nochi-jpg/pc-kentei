.pbtn:hover{background:#e6efff}

.pbtn .b{font-size:15px;color:#8a97ab}
.prow{display:flex;align-items:center;gap:8px;height:72px;border-bottom:1px solid #e3e8f0}
.prow .pn2{width:150px;font-size:22px;font-weight:bold;white-space:nowrap}
.tg{width:136px;height:52px;border:2px solid #b8c4d8;background:#fff;border-radius:10px;font-size:19px;font-weight:bold;color:#56627a;cursor:pointer}
.tg.on{background:#3d7be0;border-color:#3d7be0;color:#fff}

/* 先生へ */

.tpage td:first-child{width:170px;font-weight:bold;background:#f4f7fb}
.pager{position:absolute;left:50px;top:656px;width:1180px;height:52px;display:flex;justify-content:center;align-items:center;gap:20px}

.pager .pi{width:120px;text-align:center;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div id="app">

<div id="title" class="screen on">
  <div class="big">パソコンそうさ名人</div>
  <div class="lead">トラックパッドと キーボードの きほんを みにつけよう</div>
  <div class="tpad" id="titlePad"></div>
  <div class="menu">
    <button class="btn" data-go="prac">れんしゅう</button>
    <button class="btn go" data-go="chal">チャレンジ</button>
    <button class="btn sub" data-go="teach">先生へ</button>
  </div>
  <div class="cr">K.nom</div>
</div>

<div id="prac" class="screen">
  <div class="hd"><button class="btn sub sm" data-go="title">もどる</button><div class="ttl">れんしゅう　えらんで やってみよう</div><div class="rt" id="pracCount"></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">クリアした ステージには「クリア」が つきます。</div>
</div>

<div id="chal" class="screen">
  <div class="hd"><button class="btn sub sm" data-go="title">もどる</button><div class="ttl">チャレンジ　ぜんぶの もんだいを はやく、ミスなく</div><div class="rt">タイム と ミス</div></div>
  <div class="ccards" id="ccards"></div>
  <div class="foot">ミス0 で めやすタイムより はやいと「名人」に なれます。</div>
</div>

<div id="teach" class="screen">
  <div class="hd"><button class="btn sub sm" data-go="title">もどる</button><div class="ttl">先生へ</div><div class="rt" id="tpNo">1 / 2</div></div>
  <div class="tpage" id="tpage"></div>
  <div class="pager"><button class="btn sub" id="tpPrev">まえへ</button><div class="pi" id="tpPi">1 / 2</div><button class="btn sub" id="tpNext">つぎへ</button></div>
</div>

<div id="play" class="screen">
  <div class="hd"><button class="btn sub sm" id="quit">やめる</button><div class="ttl" id="pTitle"></div><div class="rt" id="pRight"></div></div>
  <div class="taskbar"><div class="tx" id="pTask"></div><div class="pg" id="pProg"></div></div>
  <div id="area"></div>
  <div class="pfoot"><button class="btn sub" id="howBtn">やり方を 見る</button><div id="msg"></div></div>
  <div class="ov" id="howOv"><div class="panel" id="howP"><div class="ht" id="howT"></div><div class="hl" id="howL"></div><div class="hr" id="howR"></div><div class="hb"><button class="btn go" id="howGo">やってみる</button></div></div></div>
  <div class="ov" id="clrOv"><div class="panel" id="clrP"><div class="c1" id="c1">できた！</div><div class="c2" id="c2"></div><div class="c3" id="c3"></div><div class="cbs" id="cbs"></div></div></div>
  <div class="ov" id="flashOv"><div class="flash" id="flashT">クリア！</div></div>
</div>

</div>
<script>
'use strict';
const app=document.getElementById('app');
let S=1;
function fit(){S=Math.min(innerWidth/1280,innerHeight/720);app.style.transform='translate(-50%,-50%) scale('+S+')';}
addEventListener('resize',fit);fit();

const $=id=>document.getElementById(id);
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
function pos(e,x,y,w,h){e.style.left=x+'px';e.style.top=y+'px';if(w!=null)e.style.width=w+'px';if(h!=null)e.style.height=h+'px';return e;}
function inR(c,z){return c.x>=z.offsetLeft&&c.x<=z.offsetLeft+z.offsetWidth&&c.y>=z.offsetTop&&c.y<=z.offsetTop+z.offsetHeight;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 保存 ---------- */
const SKEY='pcsousa_v1';
let SAVE={clear:{},best:{}};
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.clear)SAVE=s;}catch(e){}
function store(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}}

/* ---------- アイコン ---------- */
const IC={
 like:'<svg viewBox="0 0 24 24"><path d="M2 10h4v11H2z" fill="#e8b04a"/><path d="M8 10l4-8c1.7 0 3 1.3 3 3v4h5.3c1.3 0 2.2 1.2 1.9 2.4l-1.6 7.4c-.2 1-1.1 1.7-2.1 1.7H8z" fill="#f3c64b" stroke="#c99a1e"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.4 3.2 5 6.6 5c2.2 0 3.6 1.3 5.4 3.3C13.8 6.3 15.2 5 17.4 5c3.4 0 5.6 3.4 4.2 6.8C19.5 16.4 12 21 12 21z" fill="#e8533a"/></svg>',
 smile:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f3c64b" stroke="#c99a1e"/><circle cx="8.5" cy="10" r="1.4" fill="#5a3b10"/><circle cx="15.5" cy="10" r="1.4" fill="#5a3b10"/><path d="M7.5 14c1.2 2.2 7.8 2.2 9 0" stroke="#5a3b10" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
 wow:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f3c64b" stroke="#c99a1e"/><circle cx="8.5" cy="9.5" r="1.5" fill="#5a3b10"/><circle cx="15.5" cy="9.5" r="1.5" fill="#5a3b10"/><ellipse cx="12" cy="16" rx="2.2" ry="2.8" fill="#5a3b10"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b4c7e" stroke-width="2"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M5 16V5a2 2 0 0 1 2-2h9"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b4c7e" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>',
 cmt:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b4c7e" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 undo:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b4c7e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
 redo:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b4c7e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>',
 find:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b4c7e" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg>',
 rep:'<svg viewBox="0 0 24 24" fill="none" stroke="#2b4c7e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>'
};
const RN={like:'いいね',heart:'ハート',smile:'にこにこ',wow:'びっくり'};

/* ---------- トラックパッド図 ---------- */
function padSVG(g){
 const f=(x,y,c)=>'<g class="'+c+'"><circle cx="'+x+'" cy="'+y+'" r="20" class="fg"/></g>';
 let z='',fs='';
 if(g==='tap1'||g==='dbl'||g==='drag')z='<rect x="20" y="200" width="190" height="60" class="zone" clip-path="url(#pc)"/>';
 if(g==='tap2')z='<rect x="210" y="200" width="190" height="60" class="zone" clip-path="url(#pc)"/>';
 if(g==='tap1')fs=f(210,110,'a-tap');
 else if(g==='dbl')fs=f(210,110,'a-dbl');
 else if(g==='tap2')fs=f(186,110,'a-tap')+f(236,110,'a-tap');
 else if(g==='drag')fs=f(130,140,'a-drag');
 else if(g==='hover')fs=f(130,140,'a-hover');
 else if(g==='scroll')fs=f(186,110,'a-scroll')+f(236,110,'a-scroll');
 else if(g==='pinch')fs=f(190,110,'a-pinL')+f(230,110,'a-pinR');
 return '<svg viewBox="0 0 420 280" width="420" height="280"><defs><clipPath id="pc"><rect x="20" y="20" width="380" height="240" rx="20"/></clipPath></defs><rect x="20" y="20" width="380" height="240" rx="20" class="pad"/>'+z+'<line x1="20" y1="200" x2="400" y2="200" class="pl"/><line x1="210" y1="200" x2="210" y2="260" class="pl"/><text x="115" y="238" class="pt">左</text><text x="305" y="238" class="pt">右</text>'+fs+'</svg>';
}
function keysHTML(list){return list.map(k=>'<span class="key">'+k+'</span>').join('<span>+</span>');}
$('titlePad').innerHTML=padSVG('tap1');

/* ---------- 右クリックメニュー ---------- */
function showMenu(a,x,y,items){
 closeMenu(a);
 const m=el('div','cmenu',null,a.area);
 items.forEach(it=>{const b=el('button',null,(it.ic?IC[it.ic]:'')+'<span>'+it.t+'</span>',m);b.addEventListener('click',ev=>{ev.stopPropagation();closeMenu(a);it.fn();});});
 const w=240,h=items.length*52+16;
 pos(m,Math.min(x,1228-w),Math.min(y,492-h));
 a._menu=m;
}
function closeMenu(a){if(a._menu){a._menu.remove();a._menu=null;}}

/* ---------- ドラッグ ---------- */
function draggable(a,node,onDrop){
 let sx,sy,ox,oy,on=false,moved=false;
 a.on(node,'pointerdown',e=>{if(e.button!==0)return;e.preventDefault();node.setPointerCapture(e.pointerId);on=true;moved=false;sx=e.clientX;sy=e.clientY;ox=node.offsetLeft;oy=node.offsetTop;node.classList.add('dragging');});
 a.on(node,'pointermove',e=>{if(!on)return;const dx=(e.clientX-sx)/S,dy=(e.clientY-sy)/S;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
   const nx=Math.max(0,Math.min(1228-node.offsetWidth,ox+dx)),ny=Math.max(0,Math.min(492-node.offsetHeight,oy+dy));node.style.left=nx+'px';node.style.top=ny+'px';
   if(a._hover)a._hover({x:nx+node.offsetWidth/2,y:ny+node.offsetHeight/2});});
 const end=()=>{if(!on)return;on=false;node.classList.remove('dragging');const c={x:node.offsetLeft+node.offsetWidth/2,y:node.offsetTop+node.offsetHeight/2};
   if(a._hover)a._hover(null);onDrop(c,moved,()=>{node.style.left=ox+'px';node.style.top=oy+'px';});};
 a.on(node,'pointerup',end);a.on(node,'pointercancel',end);
}

/* =========================================================
   ステージ
   ========================================================= */
const STEPS=[
 {n:1,grade:'1・2年',color:'#e8833a',goal:90},
 {n:2,grade:'3・4年',color:'#3d9a5b',goal:240},
 {n:3,grade:'5・6年',color:'#7a5bd0',goal:240}
];
const ST=[];

/* 1 クリック */
ST.push({id:'click',step:1,title:'クリック',desc:'ものを えらぶ、ボタンを おす。いちばん きほんの そうさ',
 how:{g:'tap1',cap:'1本の ゆびで トン',lines:['1本の ゆびで パッドを かるく「トン」','または パッドの 左下を「カチッ」と おす','やじるしを まるに あわせてから おそう']},
 task:'あらわれる まとを クリックしよう',
 build(a){const N=5;let n=0;a.prog(0,N);
  const t=el('div','tgt',null,a.area);
  const place=()=>pos(t,40+Math.random()*1030,30+Math.random()*320);place();
  a.on(t,'click',()=>{n++;a.prog(n,N);if(n>=N)a.done();else{a.say('いいね！ つぎの まとへ','ok');place();}});
  a.on(t,'contextmenu',()=>a.miss('それは 右クリック。1本ゆびで トン しよう'));
 }});

/* 2 ダブルクリック */
ST.push({id:'dbl',step:1,title:'ダブルクリック',desc:'2回 つづけて はやく クリック。フォルダーを ひらくときに つかう',
 how:{g:'dbl',cap:'1本の ゆびで トントン',lines:['1本の ゆびで「トントン」と 2回 つづけて','ゆっくりだと 1回の クリックに なるよ','左下を「カチカチッ」と おしても できる']},
 task:'フォルダーを ダブルクリックして ぜんぶ ひらこう',
 build(a){const names=['こくご','さんすう','せいかつ'];let n=0;a.prog(0,3);
  names.forEach((nm,i)=>{const f=pos(el('div','fold','<div class="ppr"></div><div class="fb"></div><div class="fl">'+nm+'</div>',a.area),226+i*300,150);
   let tm=null;
   a.on(f,'click',e=>{if(f.classList.contains('open'))return;a.area.querySelectorAll('.fold').forEach(x=>x.classList.remove('sel'));f.classList.add('sel');
     if(e.detail===1){clearTimeout(tm);tm=a.later(()=>{if(!f.classList.contains('open'))a.say('いまのは 1回の クリック。もっと はやく トントン','info');},550);}});
   a.on(f,'dblclick',()=>{clearTimeout(tm);if(f.classList.contains('open'))return;f.classList.remove('sel');f.classList.add('open');n++;a.prog(n,3);
     if(n>=3)a.done();else a.say('ひらいた！','ok');});
   a.on(f,'contextmenu',()=>a.miss('それは 右クリック。1本ゆびで トントン'));
  });
 }});

/* 3 右クリック */
ST.push({id:'rclick',step:1,title:'右クリック',desc:'メニューを 出す クリック。2本の ゆびで トン',
 how:{g:'tap2',cap:'2本の ゆびで トン',lines:['2本の ゆびを そろえて「トン」','または パッドの 右下を「カチッ」と おす','メニューが 出たら 1本ゆびで えらぶ']},
 task:'絵を 右クリックして、メニューから「いいね」を えらぼう',
 build(a){const P=[
   {n:'たいようの 絵',h:'<div style="position:absolute;inset:0;background:#bfe3ff"></div><div style="position:absolute;left:97px;top:60px;width:100px;height:100px;border-radius:50%;background:#f3c64b;box-shadow:0 0 0 14px rgba(243,198,75,.35)"></div>'},
   {n:'やまの 絵',h:'<div style="position:absolute;inset:0;background:#e8f6ff"></div><div style="position:absolute;left:27px;top:60px;width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-bottom:160px solid #5aa36a"></div><div style="position:absolute;left:150px;top:100px;width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-bottom:120px solid #3d8a52"></div>'},
   {n:'おうちの 絵',h:'<div style="position:absolute;inset:0;background:#fff6e3"></div><div style="position:absolute;left:57px;top:30px;width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:80px solid #e8533a"></div><div style="position:absolute;left:77px;top:110px;width:140px;height:90px;background:#f3c64b"></div><div style="position:absolute;left:127px;top:140px;width:40px;height:60px;background:#a0703a"></div>'}];
  let n=0;a.prog(0,3);
  P.forEach((p,i)=>{const c=pos(el('div','pcard','<div class="pic">'+p.h+'</div><div class="pn">'+p.n+'</div><div class="lk">'+IC.heart+'いいね</div>',a.area),100+i*370,90);
   a.on(c,'contextmenu',e=>{e.preventDefault();const r=a.rel(e);
     showMenu(a,r.x,r.y,[{t:'コピー',ic:'copy',fn:()=>a.say('いまは「いいね」を えらぼう','info')},{t:'いいね',ic:'heart',fn:()=>{
        if(c.classList.contains('liked')){a.say('この 絵には もう いいね したよ','info');return;}
        c.classList.add('liked');n++;a.prog(n,3);if(n>=3)a.done();else a.say('いいね できた！','ok');}},
      {t:'さくじょ',ic:'trash',fn:()=>a.say('けしちゃ だめ。「いいね」を えらぼう','info')}]);});
   a.on(c,'click',()=>{if(!a._menu)a.miss('それは 左クリック。2本ゆびで トン しよう');});
  });
  a.on(a.area,'pointerdown',e=>{if(a._menu&&!a._menu.contains(e.target)&&e.button===0)closeMenu(a);});
 }});

/* 4 ドラッグ＆ドロップ */
ST.push({id:'drag',step:1,title:'ドラッグ＆ドロップ',desc:'おしたまま うごかして、はなす。ものを うごかす そうさ',
 how:{g:'drag',cap:'おしたまま うごかす',lines:['うごかしたい ものに やじるしを あわせる','左下を おしたまま、べつの ゆびで パッドを なぞる','かごの 上で ゆびを はなす']},
 task:'くだものを ぜんぶ かごに 入れよう',
 build(a){const F=[['りんご','#e8533a','#fff'],['みかん','#f39a2b','#fff'],['ぶどう','#7a5bd0','#fff'],['バナナ','#f3d34b','#5a3b10'],['メロン','#6cbf5b','#fff']];
  const B=pos(el('div','basket','<div class="bl">かご</div>',a.area),436,250,360,214);
  let n=0;a.prog(0,5);
  a._hover=c=>B.classList.toggle('hot',!!c&&inR(c,B));
  F.forEach((f,i)=>{const it=pos(el('div','item',f[0],a.area),126+i*210,50);it.style.background=f[1];it.style.color=f[2];
   draggable(a,it,(c,moved,back)=>{
    if(inR(c,B)){const k=n;pos(it,B.offsetLeft+16+(k%3)*114,B.offsetTop+44+Math.floor(k/3)*78);it.style.pointerEvents='none';n++;a.prog(n,5);
      if(n>=5)a.done();else a.say('かごに 入った！','ok');}
    else{back();a.say(moved?'かごの 上で はなそう':'おしたまま うごかそう','info');}});
  });
 }});

/* 5 2本ゆびスクロール */
ST.push({id:'scroll',step:1,title:'スクロール',desc:'2本の ゆびで 上下に なぞって、画面を うごかす',
 how:{g:'scroll',cap:'2本の ゆびで 上下に なぞる',lines:['2本の ゆびを そろえて パッドに おく','そのまま 上や 下に なぞる','見えない ところが 出てくるよ']},
 task:'下の ほうに ある「ゴール」を さがして クリックしよう',
 build(a){const W=pos(el('div','win',null,a.area),296,40,640,416);
  const C=el('div','abs',null,W);pos(C,0,0,620,1024);
  const names=['スタート','あさがお','ひまわり','チューリップ','たんぽぽ','さくら','ばら','ゆり','すみれ','コスモス','あじさい','つばき','パンジー','ゴール！ ここを クリック','なのはな','うめ'];
  const rows=names.map((nm,i)=>{const r=pos(el('div','srow',(i===0||i===13)?nm:(i+'　'+nm),C),0,i*64);if(i===0)r.classList.add('start');if(i===13)r.classList.add('goal');return r;});
  const trk=el('div','strk',null,W),th=el('div','sthm',null,trk);
  let off=0,ph=0;const max=1024-412;
  const upd=()=>{C.style.transform='translateY('+(-off)+'px)';th.style.top=(off/max*(408-80))+'px';};upd();
  a.prog(0,2);
  a.on(W,'wheel',e=>{e.preventDefault();if(e.ctrlKey)return;const d=e.deltaY*(e.deltaMode===1?32:1);off=Math.max(0,Math.min(max,off+d));upd();},{passive:false});
  a.on(rows[13],'click',()=>{if(ph!==0)return;ph=1;rows[13].classList.add('done');rows[13].textContent='ゴール クリア';a.prog(1,2);

/* =========================================================
   進行
   ========================================================= */
let mode='prac',cur=null,curStep=1,chal=null,timerId=null;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
function say(t,k){const m=$('msg');m.textContent=t||'';m.className=k||'';}

document.addEventListener('contextmenu',e=>{if(!e.target.closest('.allowctx'))e.preventDefault();});
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('keydown',e=>{
 if(e.ctrlKey&&['KeyS','KeyF','KeyH','KeyP','KeyO','KeyG','KeyD','KeyU','KeyJ','KeyY','Equal','Minus','Semicolon','Digit0'].includes(e.code))e.preventDefault();
 if(cur&&cur.alive&&!$('howOv').classList.contains('on')&&!$('clrOv').classList.contains('on'))cur.keys.forEach(f=>f(e));
});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
function go(id){if(id==='prac')drawPrac();if(id==='chal')drawChal();if(id==='teach')drawTeach(0);show(id);}

function cleanup(){if(cur){cur.alive=false;cur.offs.forEach(f=>f());}cur=null;$('area').innerHTML='';say('');}
function makeApi(st){
 const area=$('area');const c={alive:true,offs:[],keys:[],st:st,finished:false};
 const a={area:area,chal:mode==='chal',_menu:null,_hover:null,start:null,
  on(t,ty,fn,o){t.addEventListener(ty,fn,o);c.offs.push(()=>t.removeEventListener(ty,fn,o));},
  later(fn,ms){const id=setTimeout(()=>{if(c.alive)fn();},ms);c.offs.push(()=>clearTimeout(id));return id;},
  key(fn){c.keys.push(fn);},
  rel(e){const r=area.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S};},
  task(t){$('pTask').textContent=t;},
  prog(n,t){$('pProg').textContent=n+' / '+t;},
  say:say,
  miss(t){if(mode==='chal'&&chal)chal.miss++;say(t,'ng');updRight();},
  done(){if(c.finished)return;c.finished=true;say('できた！','ok');setTimeout(()=>{if(cur===c)finish();},450);}
 };
 c.api=a;return c;
}
function startStage(st){
 cleanup();
 $('pTitle').textContent=(mode==='chal'?'チャレンジ　':'STEP'+st.step+'　')+st.title;
 $('pTask').textContent=st.task;$('pProg').textContent='';
 cur=makeApi(st);st.build(cur.api);updRight();
 if(mode==='prac')openHow(st);else if(cur.api.start)cur.api.start();
 show('play');
}
function updRight(){const r=$('pRight');
 if(mode==='chal'&&chal){const t=(Date.now()-chal.t0)/1000;r.textContent=Math.floor(t)+'びょう　ミス'+chal.miss;}
 else if(cur)r.textContent=STEPS[cur.st.step-1].grade;}
function openHow(st){const h=st.how;$('howT').textContent=st.title+' の やり方';
 const L=$('howL');L.innerHTML='';
 if(h.keys){h.keys.forEach(k=>{const r=el('div','keys',null,L);el('span','kn',k[k.length-1],r);r.insertAdjacentHTML('beforeend',keysHTML(k.slice(0,-1)));});}
 else L.innerHTML=padSVG(h.g);
 el('div','hcap',h.cap,L);
 const R=$('howR');R.innerHTML='';h.lines.forEach((t,i)=>{const d=el('div','li',null,R);el('b',null,String(i+1),d);el('span',null,t,d);});
 $('howOv').classList.add('on');}
$('howBtn').addEventListener('click',()=>{if(cur)openHow(cur.st);});
$('howGo').addEventListener('click',()=>{$('howOv').classList.remove('on');if(cur&&cur.api.start&&!cur.started){cur.started=true;cur.api.start();}});
$('quit').addEventListener('click',()=>{stopTimer();cleanup();$('howOv').classList.remove('on');$('clrOv').classList.remove('on');$('flashOv').classList.remove('on');go(mode==='chal'?'chal':'prac');});

function finish(){const st=cur.st;
 if(mode==='prac'){SAVE.clear[st.id]=true;store();
  const list=ST.filter(s=>s.step===st.step);const idx=list.indexOf(st);const nx=list[idx+1];
  $('c1').textContent='できた！';$('c2').textContent=st.title+' クリア';$('c3').textContent=nx?'つぎは「'+nx.title+'」':'STEP'+st.step+' の ステージを ぜんぶ やったね';
  const B=$('cbs');B.innerHTML='';
  const b1=el('button','btn sub','もう一度',B),b2=el('button','btn'+(nx?' go':' off'),'つぎへ',B),b3=el('button','btn sub','えらぶ画面',B);
  b1.onclick=()=>{$('clrOv').classList.remove('on');startStage(st);};
  b2.onclick=()=>{if(!nx)return;$('clrOv').classList.remove('on');startStage(nx);};
  b3.onclick=()=>{$('clrOv').classList.remove('on');cleanup();go('prac');};
  $('clrOv').classList.add('on');}
 else{chal.i++;
  if(chal.i>=chal.list.length){endChal();return;}
  $('flashOv').classList.add('on');setTimeout(()=>{$('flashOv').classList.remove('on');if(chal)startStage(chal.list[chal.i]);},700);}
}

/* ---------- れんしゅう画面 ---------- */
function drawPrac(){const T=$('tabs');T.innerHTML='';
 STEPS.forEach(s=>{const b=el('button','tab'+(s.n===curStep?' on':''),'STEP'+s.n+'　'+s.grade,T);if(s.n===curStep)b.style.background=s.color;b.onclick=()=>{curStep=s.n;drawPrac();};});
 const G=$('grid');G.innerHTML='';const col=STEPS[curStep-1].color;
 const list=ST.filter(s=>s.step===curStep);
 list.forEach((s,i)=>{const c=el('div','card'+(SAVE.clear[s.id]?' clr':''),null,G);const no=el('div','no',String(i+1),c);no.style.background=col;
  el('div','ct',s.title,c);el('div','cd',s.desc,c);el('div','bd','クリア',c);c.onclick=()=>{mode='prac';startStage(s);};});
 $('pracCount').textContent='クリア '+ST.filter(s=>SAVE.clear[s.id]).length+' / '+ST.length;}

/* ---------- チャレンジ ---------- */
function fmt(t){return Math.floor(t)+'びょう';}
function rankOf(t,m,goal){return m===0&&t<=goal?'名人':m<=3?'たつじん':'みならい';}
function drawChal(){const C=$('ccards');C.innerHTML='';
 STEPS.forEach(s=>{const c=el('div','ccard',null,C);const h=el('div','cs','STEP'+s.n,c);h.style.background=s.color;
  el('div','cg',s.grade,c);const n=ST.filter(x=>x.step===s.n).length;el('div','cn',n+'もん　めやす '+s.goal+'びょう',c);
  const bx=el('div','cb',null,c);el('div','l','ベスト きろく',bx);const b=SAVE.best[s.n];
  el('div','v',b?fmt(b.t)+'　ミス'+b.m:'まだ なし',bx);el('div','v2',b?b.r:'',bx);
  c.onclick=()=>startChal(s.n);});}
function startChal(n){mode='chal';chal={step:n,list:ST.filter(s=>s.step===n),i:0,miss:0,t0:Date.now()};stopTimer();timerId=setInterval(updRight,250);startStage(chal.list[0]);}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function endChal(){stopTimer();const t=(Date.now()-chal.t0)/1000,m=chal.miss,s=STEPS[chal.step-1],r=rankOf(t,m,s.goal);
 const b=SAVE.best[chal.step];let nb=false;
 if(!b||m<b.m||(m===b.m&&t<b.t)){SAVE.best[chal.step]={t:t,m:m,r:r};store();nb=true;}
 $('c1').textContent=r;$('c2').textContent='タイム '+fmt(t)+'　ミス '+m;$('c3').textContent=(nb?'ベスト きろく こうしん！':'ベスト '+fmt(b.t)+'　ミス'+b.m)+'　めやす '+s.goal+'びょう';
 const B=$('cbs');B.innerHTML='';const step=chal.step;
 const b1=el('button','btn go','もう一度',B),b3=el('button','btn sub','もどる',B);
 b1.onclick=()=>{$('clrOv').classList.remove('on');startChal(step);};
 b3.onclick=()=>{$('clrOv').classList.remove('on');cleanup();chal=null;go('chal');};
 $('clrOv').classList.add('on');}
