<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小学校パソコンスキルマスター</title>
<style>
/* ===== 小学校パソコンスキルマスター ===== */
:root{--navy:#10264d;--blue:#2a63c9;--bg:#2f6fd8;--yellow:#ffd23f;--yellow2:#ffe27a;--green:#36c96f;--lock:#dfe5ee;--lockc:#7f8ca3;--red:#ff6b6b;--pale:#eaf2ff;--sub:#4d6290;--sky:#d6e6ff;
 --font:"BIZ UDPGothic","BIZ UDPゴシック","BIZ UDゴシック","Meiryo UI","Yu Gothic UI",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a36}
body{font-family:var(--font);user-select:none;-webkit-user-select:none}
#app{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;overflow:hidden;color:var(--navy);font-family:var(--font);
 background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.12) 3px,transparent 3px),linear-gradient(160deg,#2a63c9 0%,#3f86ec 60%,#62a9ff 100%);background-size:30px 30px,100% 100%}
#app *{box-sizing:border-box}
#app.lock,#app.lock *{pointer-events:none!important}
button{font-family:inherit;color:inherit}
.abs{position:absolute}
.hide{display:none!important}
.screen{position:absolute;left:0;top:0;width:1280px;height:664px}
.screen.out{animation:fadeOut .22s ease-in both}
@keyframes fadeOut{to{opacity:0;transform:translateY(8px)}}
.enter{animation:slideIn .42s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes slideIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.enterR{animation:slideR .42s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.popin{animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.openwin{animation:openwin .34s cubic-bezier(.3,1.4,.5,1) both}
@keyframes openwin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.outline{color:#fff;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill}

/* ---- ボタン ---- */
.btn{height:52px;border:4px solid var(--navy);border-radius:16px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 var(--navy);background:#fff;color:var(--navy);
 display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;white-space:nowrap;transition:background-color .15s,transform .1s,box-shadow .1s;flex:none}
.btn:hover{background:var(--sky)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.btn.y{background:var(--yellow)}.btn.y:hover{background:var(--yellow2)}
.btn.g{background:var(--green);color:#fff;-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}.btn.g:hover{background:#5ad98b}
.btn.r{background:var(--red);color:#fff;-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}.btn.r:hover{background:#ff8b8b}
.btn.lockb,.btn:disabled{background:var(--lock);color:var(--lockc);border-color:var(--lockc);box-shadow:0 5px 0 var(--lockc);cursor:not-allowed;-webkit-text-stroke:0}
.btn.lockb:hover,.btn:disabled:hover{background:var(--lock)}
.btn.lockb:active,.btn:disabled:active{transform:none;box-shadow:0 5px 0 var(--lockc)}
.btn.sm{height:44px;font-size:18px;border-radius:14px;box-shadow:0 4px 0 var(--navy)}
.btn.sm:active{box-shadow:0 1px 0 var(--navy)}
.btn svg{width:22px;height:22px;flex:none}

/* ---- ウィンドウ ---- */
.win{position:absolute;background:var(--pale);border:4px solid var(--navy);border-radius:20px;box-shadow:8px 8px 0 var(--navy);overflow:hidden}
.wbar{height:58px;background:var(--blue);border-bottom:4px solid var(--navy);display:flex;align-items:center;gap:8px;padding:0 10px 0 14px}
.wbar img{width:44px;height:35px;flex:none}
.wtitle{flex:1;min-width:0;line-height:1.9;color:#fff;font-size:22px;font-weight:700;-webkit-text-stroke:4px var(--navy);paint-order:stroke fill;white-space:nowrap;overflow:hidden}
.wctl{width:40px;height:34px;border:3px solid var(--navy);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.wctl svg{width:18px;height:18px;fill:none;stroke:var(--navy);stroke-width:3;stroke-linecap:round}
.wctl.close{background:var(--red);cursor:pointer;transition:background-color .15s,transform .1s}.wctl.close svg{stroke:#fff}
.wctl.close:hover{background:#ff8b8b}.wctl.close:active{transform:translateY(2px)}
.wbody{position:absolute;left:0;top:58px;right:0;bottom:0}

/* ---- タスクバー ---- */
#task{position:absolute;left:0;top:664px;width:1280px;height:56px;background:var(--navy);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:50}
.startbtn{width:44px;height:40px;border-radius:10px;border:3px solid #fff;background:var(--yellow);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:7px;cursor:pointer;transition:background-color .15s,transform .1s;flex:none}
.startbtn:hover{background:var(--yellow2)}.startbtn:active{transform:translateY(2px)}
.startbtn span{background:var(--navy);border-radius:2px}
.tbtn{height:40px;width:132px;border-radius:10px;border:3px solid #fff;background:transparent;color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:background-color .15s,color .15s,transform .1s;flex:none}
.tbtn:hover{background:#fff;color:var(--navy)}
.tbtn.tback{width:250px}.tbtn:active{transform:translateY(2px)}
#prog{margin-left:auto;margin-right:4px;font-size:12px;color:rgba(255,255,255,.32);white-space:nowrap;letter-spacing:.5px}

/* ---- ぱそた ---- */
.pasota{position:absolute;border:none;background:none;padding:0;cursor:pointer}
.pasota .pf{width:100%;height:100%;animation:fuwa 3s ease-in-out infinite}
.pasota .pj{width:100%;height:100%}
.pasota img{width:100%;height:100%;display:block;transition:transform .3s cubic-bezier(.3,1.8,.5,1);pointer-events:none}
.pasota:hover img{transform:translateY(-14px) rotate(-2deg)}
.pasota.still{cursor:default}.pasota.still:hover img{transform:none}
.jumpA{animation:jumpA .5s cubic-bezier(.3,1.6,.5,1)}.jumpB{animation:jumpB .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes jumpA{0%{transform:translateY(0)}40%{transform:translateY(-40px) scale(1.04)}100%{transform:translateY(0)}}
@keyframes jumpB{0%{transform:translateY(0)}40%{transform:translateY(-40px) scale(1.04)}100%{transform:translateY(0)}}
@keyframes fuwa{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---- 吹き出し ---- */
.bubble{position:absolute;background:#fff;border:4px solid var(--navy);border-radius:24px;box-shadow:6px 6px 0 var(--navy);padding:14px 22px;display:flex;flex-direction:column;justify-content:center;font-size:20px;font-weight:400;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.bubble .bt{white-space:pre-line}
.bubble.down::after{content:"";position:absolute;left:var(--tx,176px);bottom:-17px;width:26px;height:26px;background:#fff;border-right:4px solid var(--navy);border-bottom:4px solid var(--navy);transform:rotate(45deg)}
.bubble.left::after{content:"";position:absolute;left:-17px;top:var(--ty,30px);width:26px;height:26px;background:#fff;border-left:4px solid var(--navy);border-bottom:4px solid var(--navy);transform:rotate(45deg)}

/* ---- タイトル ---- */
.logo{position:absolute;left:240px;top:170px;width:800px;text-align:center}
.logo .l1{font-size:34px;font-weight:700;color:var(--yellow);-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;letter-spacing:6px}
.logo .l2{margin-top:2px;font-size:64px;font-weight:700;color:#fff;-webkit-text-stroke:9px var(--navy);paint-order:stroke fill;letter-spacing:3px;text-shadow:0 8px 0 var(--navy);white-space:nowrap}
.logo .l4{margin:26px auto 0;font-size:22px;font-weight:700;color:#fff;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;line-height:1.55}
.logo .l3{margin:28px auto 0;width:520px;height:48px;border-radius:24px;background:#fff;border:4px solid var(--navy);box-shadow:5px 5px 0 var(--navy);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.dicon{position:absolute;left:28px;top:30px;width:116px;height:118px;border:3px solid transparent;border-radius:10px;background:transparent;padding:6px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background-color .15s}
.dicon:hover{background:rgba(255,255,255,.18)}
.dicon.sel{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.75)}
.dicon img{width:92px;height:73px;transition:transform .25s cubic-bezier(.3,1.8,.5,1);pointer-events:none}
.dicon:hover img{transform:translateY(-6px)}
.dicon .lbl{height:26px;padding:0 10px;border-radius:13px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center}
.ibub{position:absolute;left:160px;top:38px;width:292px;height:92px;background:#fff;border:4px solid var(--navy);border-radius:20px;box-shadow:5px 5px 0 var(--navy);display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:700;line-height:1.45;white-space:pre-line}
.ibub::before{content:"";position:absolute;left:-17px;top:30px;width:22px;height:22px;background:#fff;border-left:4px solid var(--navy);border-bottom:4px solid var(--navy);transform:rotate(45deg)}

/* ---- ホーム ---- */
.hello{position:absolute;left:856px;top:44px;width:400px;font-size:22px;font-weight:700;color:#fff;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;white-space:nowrap}
.cards{position:absolute;left:20px;top:16px;width:752px;height:530px;display:flex;flex-direction:column;justify-content:space-evenly}
.card{height:124px;background:#fff;border:4px solid var(--navy);border-radius:20px;box-shadow:5px 5px 0 var(--navy);padding:0 18px;display:flex;align-items:center;gap:18px;flex:none}
.badge{width:88px;height:88px;border-radius:50%;border:4px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700;color:#fff;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15);flex:none}
.badge.bm{font-size:17px;letter-spacing:-1px}
.b3{background:#e0874a}.b2{background:#a9b8cf}.b1{background:#ffc928}
.bm{background:conic-gradient(#ff6b6b,#ffd23f,#36c96f,#3fa9ff,#9b6bff,#ff6bd5,#ff6b6b)}
.info{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.cname{font-size:25px;font-weight:700;white-space:nowrap}
.csub{font-size:16px;font-weight:400;color:var(--sub)}
.barrow{display:flex;align-items:center;gap:12px}
.barlbl{width:150px;font-size:16px;font-weight:700;white-space:nowrap}
.gauge{flex:1;height:20px;border-radius:10px;border:3px solid var(--navy);background:#dbe7fb;overflow:hidden}
.gauge .fill{height:100%;background:var(--green);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);transition:width .6s}
.chip{align-self:flex-start;height:30px;padding:0 14px;border-radius:15px;border:3px solid var(--navy);font-size:15px;font-weight:700;display:flex;align-items:center;white-space:nowrap}
.c-ok{background:var(--green);color:#fff;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill}
.c-ready{background:var(--yellow)}
.c-wait{background:var(--sky)}.c-lock{background:#eef1f6;color:var(--sub)}
.cbtns{display:flex;flex-direction:column;gap:12px;flex:none}
.cbtns .btn{width:156px;height:44px;font-size:18px;border-radius:14px;box-shadow:0 4px 0 var(--navy)}
.cbtns .btn:active{box-shadow:0 1px 0 var(--navy)}
.cbtns .btn.lockb,.cbtns .btn.lockb:active{box-shadow:0 4px 0 var(--lockc)}

/* ---- 共通パネル ---- */
.panel{position:absolute;background:#fff;border:4px solid var(--navy);border-radius:20px;box-shadow:5px 5px 0 var(--navy)}
.h2{font-size:26px;font-weight:700}
.note{font-size:16px;color:var(--sub)}
.pager{position:absolute;display:flex;align-items:center;gap:16px}
.pager .pn{width:90px;text-align:center;font-size:18px;font-weight:700}
.pager .btn{width:150px}

/* ---- オーバーレイ ---- */
.ov{position:absolute;left:0;top:0;width:1280px;height:720px;background:rgba(16,38,77,.55);z-index:80;animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dlgbox{position:absolute;background:#fff;border:4px solid var(--navy);border-radius:24px;box-shadow:8px 8px 0 var(--navy)}

/* ---- ステージ選択 ---- */
.tabs{position:absolute;left:24px;top:16px;display:flex;gap:12px}
.tab{width:150px;height:48px;border:4px solid var(--navy);border-radius:14px 14px 0 0;background:#fff;font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s}
.tab:hover{background:var(--sky)}
.tab.on{background:var(--yellow)}
.tab .dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--navy)}
.sgrid{position:absolute;left:24px;top:80px;width:1192px;display:grid;grid-template-columns:repeat(5,224px);grid-auto-rows:200px;gap:18px 18px}
.sbtn{position:relative;border:4px solid var(--navy);border-radius:18px;background:#fff;box-shadow:5px 5px 0 var(--navy);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 10px 0;gap:10px;transition:background-color .15s,transform .1s,box-shadow .1s}
.sbtn:hover{background:var(--sky)}
.sbtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--navy)}
.sbtn .sic{width:96px;height:96px;flex:none}
.sbtn .sic svg{width:96px;height:96px}
.sbtn .snm{font-size:17px;font-weight:700;line-height:1.45;text-align:center;height:64px;width:200px;display:flex;align-items:center;justify-content:center;word-break:keep-all;overflow-wrap:anywhere}
.sbtn .sno{position:absolute;left:10px;top:8px;font-size:15px;font-weight:700;color:var(--sub)}
.sbtn .clr{position:absolute;right:8px;top:8px;width:40px;height:40px}
.sbtn.done{background:#e9fbef}.sbtn.done:hover{background:#d3f5de}
/* マスターれんしゅう */
.mrow{position:absolute;left:24px;width:1192px;height:76px;background:#fff;border:4px solid var(--navy);border-radius:16px;box-shadow:4px 4px 0 var(--navy);display:flex;align-items:center;gap:16px;padding:0 16px}
.mrow .mn{flex:1;font-size:21px;font-weight:700;white-space:nowrap}
.mrow .btn{width:190px}
.mrow .btn.done{background:#e9fbef}

/* ---- プレイ画面 ---- */
.tstrip{position:absolute;left:0;top:58px;width:1240px;height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:3px solid #c3d4f0;background:#fff}
.ttext{flex:1;min-width:0;height:60px;display:flex;align-items:center;font-size:21px;font-weight:700;line-height:1.45;padding-top:5px;word-break:keep-all;overflow-wrap:anywhere}
.tprog{width:104px;height:40px;border:3px solid var(--navy);border-radius:12px;background:var(--pale);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:none}
.hearts{display:flex;gap:6px;flex:none}
.hearts svg{width:38px;height:36px}
.hearts .lost{animation:hlost .6s both}
@keyframes hlost{0%{transform:scale(1)}30%{transform:scale(1.4) rotate(-12deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:none}}
#area{position:absolute;left:8px;top:126px;width:1224px;height:436px;overflow:hidden}
.mstrip{position:absolute;left:0;bottom:0;width:1240px;height:62px;border-top:3px solid #c3d4f0;background:#fff;display:flex;align-items:center;gap:12px;padding:0 14px}
.mstrip .mface{width:62px;height:49px;flex:none}
.mstrip .mface img{width:62px;height:49px;display:block}
.mtext{flex:1;line-height:1.9;font-size:20px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden}
.mtext.ok{color:#1d8a47}.mtext.ng{color:#d23b3b}.mtext.info{color:#2a63c9}
.okstamp{position:absolute;left:0;top:0;width:1224px;height:436px;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none}
.okstamp svg{width:220px;height:220px;animation:stamp .4s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(6px 6px 0 rgba(16,38,77,.85))}
@keyframes stamp{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.ngflash{position:absolute;inset:0;z-index:40;pointer-events:none;background:rgba(255,107,107,.18);animation:ngf .7s both}
@keyframes ngf{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* ---- やり方 ---- */
.howbox{left:190px;top:56px;width:900px;height:560px}
.howbox .ht{position:absolute;left:0;top:22px;width:892px;text-align:center;font-size:28px;font-weight:700}
.howfig{position:absolute;left:36px;top:84px;width:420px;height:300px;display:flex;align-items:center;justify-content:center;background:var(--pale);border:3px solid #c3d4f0;border-radius:18px}
.howcap{position:absolute;left:36px;top:392px;width:420px;height:40px;line-height:40px;text-align:center;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden}
.howlines{position:absolute;left:484px;top:96px;width:380px;display:flex;flex-direction:column;gap:14px}
.howlines div{display:flex;gap:12px;font-size:19px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.howlines b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.keyrow{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.key{min-width:60px;height:50px;padding:0 12px;border:3px solid var(--navy);border-radius:10px;background:#fff;box-shadow:0 5px 0 var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;white-space:nowrap}
.keyfig{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.keyfig .kl{font-size:18px;color:var(--sub);margin-left:6px}
/* トラックパッド */
.pad .pd{fill:#d5dcea;stroke:var(--navy);stroke-width:4}
.pad .pl{stroke:#9aa8c2;stroke-width:3}
.pad .pt{font-size:19px;font-weight:700;fill:#4d6290;text-anchor:middle}
.pad .zone{fill:var(--yellow);opacity:.0}
.pad .fg{fill:rgba(255,160,120,.9);stroke:var(--navy);stroke-width:3}
.a-tap{animation:aTap 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes aTap{0%,40%,100%{transform:scale(1);opacity:.9}20%{transform:scale(.75);opacity:1}}
.a-dbl{animation:aDbl 1.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes aDbl{0%,45%,100%{transform:scale(1)}12%{transform:scale(.72)}22%{transform:scale(1)}32%{transform:scale(.72)}}
.a-hover{animation:aHov 2.4s ease-in-out infinite}
@keyframes aHov{0%,100%{transform:translate(-60px,20px)}50%{transform:translate(60px,-30px)}}
.a-drag{animation:aDrag 2.6s ease-in-out infinite}
@keyframes aDrag{0%,15%{transform:translate(-70px,0)}75%,100%{transform:translate(70px,-40px)}}
.a-press{animation:aPress 2.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes aPress{0%,8%{transform:scale(1)}14%,80%{transform:scale(.75)}90%,100%{transform:scale(1)}}
.a-scroll{animation:aScr 1.8s ease-in-out infinite}
@keyframes aScr{0%,100%{transform:translateY(-40px)}50%{transform:translateY(40px)}}
.a-scrollx{animation:aScrX 1.8s ease-in-out infinite}
@keyframes aScrX{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
.a-pinL{animation:aPL 2s ease-in-out infinite}
@keyframes aPL{0%,100%{transform:translate(10px,10px)}50%{transform:translate(-50px,-40px)}}
.a-pinR{animation:aPR 2s ease-in-out infinite}
@keyframes aPR{0%,100%{transform:translate(-10px,-10px)}50%{transform:translate(50px,40px)}}

/* ---- ステージの部品 ---- */
.sw{position:absolute;background:#fff;border:4px solid var(--navy);border-radius:14px;box-shadow:5px 5px 0 var(--navy);overflow:hidden}
.swbar{height:42px;background:#dfe9fb;border-bottom:3px solid var(--navy);display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;font-size:17px;font-weight:700;white-space:nowrap}
.swbar .sp{flex:1}
.swx{width:34px;height:30px;border:3px solid var(--navy);border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.swx svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;stroke-linecap:round}
.swx:hover{background:#ff8b8b}
.swbody{position:absolute;left:0;top:42px;right:0;bottom:0}

const ROOT=document.getElementById('scr');
let SCR=null,leaveGuard=null,BACK=null;
function newScr(name){const s={name:name,el:el('div','screen',null,ROOT),offs:[],alive:true,
  after(ms,fn){const id=setTimeout(()=>{if(s.alive)fn();},ms);s.offs.push(()=>clearTimeout(id));return id;},
  every(ms,fn){const id=setInterval(()=>{if(s.alive)fn();},ms);s.offs.push(()=>clearInterval(id));return id;},
  on(t,ty,fn,o){t.addEventListener(ty,fn,o);s.offs.push(()=>t.removeEventListener(ty,fn,o));}};return s;}
function killScr(s){if(!s)return;s.alive=false;s.offs.forEach(f=>{try{f();}catch(e){}});s.el.remove();}
/* go(画面をつくる関数, 引数...) */
function go(fn,...args){leaveGuard=null;BACK=null;closeOverlay();const old=SCR;SCR=null;lockFor(700);
 const build=()=>{killScr(old);const s=newScr(fn.name);SCR=s;fn(s,...args);updTask();
  const n=s.el.querySelectorAll('.enter,.enterR,.openwin,.popin').length;lockFor(Math.min(1200,450+n*60));};
 if(old){old.el.classList.add('out');setTimeout(build,220);}else build();}

const STAGES=[];      /* ステージは stages*.js で追加 */

function clearedCount(g){if(g==='m')return Object.keys(SAVE.mclear).length;return stagesOf(g).filter(s=>SAVE.clear[s.id]).length;}
function totalOf(g){return g==='m'?STAGES.length*3:stagesOf(g).length;}
function passed(g){return SAVE.certs.some(c=>String(c.g)===String(g));}
function prevG(g){return g===2?3:g===1?2:g==='m'?1:null;}
function masterOpen(){return passed(1);}
/* しけんの状態 */
function examState(g){if(g==='m')return passed('m')?'ok':'ready';
 const left=totalOf(g)-clearedCount(g),pv=prevG(g);
 if(passed(g))return 'ok';if(pv&&!passed(pv))return 'lock';if(left>0)return 'wait';return 'ready';}
function canExam(g){if(g==='m')return masterOpen();const pv=prevG(g);if(pv&&!passed(pv))return false;return clearedCount(g)>=totalOf(g);}

/* =========================================================
   ふりがな（漢字に 小さく ふる）
   ========================================================= */
const KJR=/[一-鿿々]/;
const DAYS={1:'ついたち',2:'ふつか',3:'みっか',4:'よっか',5:'いつか',6:'むいか',7:'なのか',8:'ようか',9:'ここのか',10:'とおか',14:'じゅうよっか',20:'はつか',24:'にじゅうよっか'};
const FKEYS=Object.keys(FURI).concat(Object.keys(FURI_CTX)).sort((a,b)=>b.length-a.length);
function furiSplit(t){const out=[];let i=0,buf='';
 const push=(b,r)=>{if(buf){out.push(buf);buf='';}out.push([b,r]);};
 while(i<t.length){const ch=t[i];if(!KJR.test(ch)){buf+=ch;i++;continue;}
  const pm=/(\d+)$/.exec(t.slice(0,i));const num=pm?+pm[1]:null;
  if(num!=null&&ch==='日'&&t[i+1]!=='本'){if(DAYS[num]){buf=buf.slice(0,buf.length-pm[1].length);push(pm[1]+'日',DAYS[num]);}else push('日','にち');i++;continue;}
  if(num!=null&&ch==='人'){if(num<=2){buf=buf.slice(0,buf.length-pm[1].length);push(pm[1]+'人',num===1?'ひとり':'ふたり');}else push('人','にん');i++;continue;}
  if(num!=null&&ch==='本'){const n1=num%10;push('本',[1,6,8,0].includes(n1)?'ぽん':n1===3?'ぼん':'ほん');i++;continue;}
  if(num!=null&&ch==='分'){const n1=num%10;push('分',[1,3,4,6,8,0].includes(n1)?'ぷん':'ふん');i++;continue;}
  if(num!=null&&ch==='行'){push('行','ぎょう');i++;continue;}
  let hit=null;for(const k of FKEYS){if(t.startsWith(k,i)){hit=k;break;}}
  if(hit&&FURI_CTX[hit]){const c=FURI_CTX[hit];push(c[0],c[1]);i+=c[0].length;continue;}
  if(hit){push(hit,FURI[hit]);i+=hit.length;continue;}
  buf+=ch;i++;}
 if(buf)out.push(buf);return out;}
function furiNode(n){const p=n.parentNode;if(!p||p.closest&&p.closest('ruby,input,textarea,script,style,svg,.noruby,.sel-box'))return;
 const t=n.nodeValue;if(!KJR.test(t))return;const parts=furiSplit(t);if(parts.length===1&&typeof parts[0]==='string')return;
 const f=document.createElement('span');f.className='fr';parts.forEach(x=>{if(typeof x==='string')f.appendChild(document.createTextNode(x));else{const r=document.createElement('ruby');r.appendChild(document.createTextNode(x[0]));const rt=document.createElement('rt');rt.textContent=x[1];r.appendChild(rt);f.appendChild(r);}});
 p.replaceChild(f,n);}
function furiAll(root){if(root.nodeType===3){furiNode(root);return;}if(root.nodeType!==1)return;if(root.closest&&root.closest('ruby,input,textarea,svg,.noruby,.sel-box'))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const L=[];let n;while(n=w.nextNode())L.push(n);L.forEach(furiNode);}
const FOBS=new MutationObserver(ms=>{FOBS.disconnect();ms.forEach(m=>{if(m.type==='characterData')furiNode(m.target);else m.addedNodes.forEach(furiAll);});FOBS.observe(APP,{childList:true,subtree:true,characterData:true});});

function hitEl(p,e){const r=e.getBoundingClientRect();return p.x>=r.left&&p.x<=r.right&&p.y>=r.top&&p.y<=r.bottom;}
function centerOf(e){const r=e.getBoundingClientRect();return{x:(r.left+r.right)/2,y:(r.top+r.bottom)/2};}
/* ドラッグ（opt.drop(中心点,うごいたか,もどす関数)、opt.hover(中心点|null)） */
function dragify(a,node,opt){let sx,sy,ox,oy,on=false,moved=false;node.classList.add('drg');
 a.on(node,'pointerdown',e=>{if(e.button!==0||node.dataset.lock)return;e.preventDefault();try{node.setPointerCapture(e.pointerId);}catch(_){}on=true;moved=false;sx=e.clientX;sy=e.clientY;ox=node.offsetLeft;oy=node.offsetTop;node.classList.add('dragging');if(opt.start)opt.start();});
 a.on(node,'pointermove',e=>{if(!on)return;const P=node.offsetParent;const dx=(e.clientX-sx)/S,dy=(e.clientY-sy)/S;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
  const nx=Math.max(0,Math.min(P.clientWidth-node.offsetWidth,ox+dx)),ny=Math.max(0,Math.min(P.clientHeight-node.offsetHeight,oy+dy));node.style.left=nx+'px';node.style.top=ny+'px';
  if(opt.hover)opt.hover(centerOf(node));});
 const end=()=>{if(!on)return;on=false;node.classList.remove('dragging');if(opt.hover)opt.hover(null);
  opt.drop(centerOf(node),moved,()=>{node.style.left=ox+'px';node.style.top=oy+'px';});};
 a.on(node,'pointerup',end);a.on(node,'pointercancel',end);}

  if(c==='n'&&s[i+1]&&!/[aiueoyn]/.test(s[i+1])){out+='ん';i++;continue;}
  let hit=null;for(let l=3;l>=1;l--){const k=s.substr(i,l);if(k.length===l&&RK[k]){hit=k;break;}}

  out+=s.slice(i);break;}
